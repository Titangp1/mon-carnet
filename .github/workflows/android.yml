name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Interface téléphone
        run: python3 tools/build_mobile.py
      - name: Projet Android (Capacitor)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir cap && cd cap
          npm init -y >/dev/null
          npm i @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1
          cp -r ../www ./www
          npx cap init "Mon Carnet" fr.moncarnet.app --web-dir www
          npx cap add android
          # micro (messages vocaux, mode vocal)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' android/app/src/main/AndroidManifest.xml
          # numéro de version
          CODE=$(echo "$VERSION" | awk -F. '{print $1*10000+$2*100+$3}')
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          # icône
          sudo apt-get install -y imagemagick >/dev/null
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}; px=${d##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert ../build/icon.png -resize ${px}x${px} android/app/src/main/res/mipmap-$dir/$n.png
            done
          done
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../Mon-Carnet-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mon-Carnet-Android
          path: Mon-Carnet-Android.apk
      - name: Ajouter l'APK à la version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" Mon-Carnet-Android.apk --clobber
