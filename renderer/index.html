<!doctype html>
<html lang="fr" data-theme="dark" data-fx="complet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>Mon Carnet</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="glass.css">
</head>
<body class="booting">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Logo de l'appli : tuile de verre bleu-violet, page d'agenda, coche et étincelle (Titan) -->
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f8bff"/><stop offset=".55" stop-color="#6d5cff"/><stop offset="1" stop-color="#b35cf2"/></linearGradient>
    <radialGradient id="lg-hi" cx=".22" cy=".12" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".55" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="lg-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6ecff"/><stop offset="1" stop-color="#d4ddff"/></linearGradient>
    <linearGradient id="lg-chk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b7bff"/><stop offset="1" stop-color="#9b4dff"/></linearGradient>
    <!-- Logo de Titan : orbe violet-bleu avec anneau (Titan, lune de Saturne) -->
    <linearGradient id="tl-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b08cff"/><stop offset=".5" stop-color="#7a3cf0"/><stop offset="1" stop-color="#2f6bff"/></linearGradient>
    <radialGradient id="tl-h" cx=".28" cy=".2" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <symbol id="logo-app" viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lg-bg)"/><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lg-hi)"/><rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".24"/><rect x="14.5" y="17.5" width="35" height="33" rx="8" fill="#0a1a4a" fill-opacity=".22" transform="translate(0 1.6)"/><rect x="14.5" y="17.5" width="35" height="33" rx="8" fill="#fff"/><path d="M14.5 25.5a8 8 0 0 1 8-8h19a8 8 0 0 1 8 8V27h-35z" fill="url(#lg-top)"/><rect x="22" y="12.5" width="4.2" height="9.5" rx="2.1" fill="#fff"/><rect x="37.8" y="12.5" width="4.2" height="9.5" rx="2.1" fill="#fff"/><path d="M23.5 38l5.6 5.2 11.6-12.4" fill="none" stroke="url(#lg-chk)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M51.5 6.5l1.7 4.6 4.6 1.7-4.6 1.7-1.7 4.6-1.7-4.6-4.6-1.7 4.6-1.7z" fill="#fff"/></symbol>
  </defs>
</svg>
<div id="ambient" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>

<div id="splash" role="status" aria-live="polite" aria-label="Synchronisation du carnet">
  <div class="sp-ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="sp-center">
    <div class="sp-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lg-bg)"/><rect x="2" y="2" width="60" height="60" rx="18" fill="url(#lg-hi)"/><rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".24"/><rect x="14.5" y="17.5" width="35" height="33" rx="8" fill="#0a1a4a" fill-opacity=".22" transform="translate(0 1.6)"/><rect x="14.5" y="17.5" width="35" height="33" rx="8" fill="#fff"/><path d="M14.5 25.5a8 8 0 0 1 8-8h19a8 8 0 0 1 8 8V27h-35z" fill="url(#lg-top)"/><rect x="22" y="12.5" width="4.2" height="9.5" rx="2.1" fill="#fff"/><rect x="37.8" y="12.5" width="4.2" height="9.5" rx="2.1" fill="#fff"/><path class="sp-check" d="M23.5 38l5.6 5.2 11.6-12.4" fill="none" stroke="url(#lg-chk)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M51.5 6.5l1.7 4.6 4.6 1.7-4.6 1.7-1.7 4.6-1.7-4.6-4.6-1.7 4.6-1.7z" fill="#fff"/></svg>
      <span class="sp-shine"></span>
    </div>
    <h1 class="sp-title">Mon Carnet</h1>
    <p class="sp-sub">Synchronisation de ton carnet…</p>
    <div class="sp-card">
      <ul class="sp-list">
        <li class="svc run" data-svc="data"><span class="svc-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg></span><span class="svc-txt"><b>Tes données</b><span class="svc-st">Ouverture…</span></span><span class="svc-state" aria-hidden="true"></span></li>
        <li class="svc run" data-svc="edt"><span class="svc-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></span><span class="svc-txt"><b>Emploi du temps de l'école</b><span class="svc-st">Connexion…</span></span><span class="svc-state" aria-hidden="true"></span></li>
        <li class="svc run" data-svc="sarool"><span class="svc-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M5 17h14M6 17v2M18 17v2M3 13l2-6a2 2 0 0 1 2-1.4h10A2 2 0 0 1 19 7l2 6v4H3z"/></svg></span><span class="svc-txt"><b>Conduite (Sarool)</b><span class="svc-st">Connexion…</span></span><span class="svc-state" aria-hidden="true"></span></li>
        <li class="svc run" data-svc="mail"><span class="svc-ico"><svg class="ico" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span><span class="svc-txt"><b>Mails de l'école</b><span class="svc-st">Connexion…</span></span><span class="svc-state" aria-hidden="true"></span></li>
        <li class="svc run" data-svc="titan"><span class="svc-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span><span class="svc-txt"><b>Titan AI</b><span class="svc-st">Connexion…</span></span><span class="svc-state" aria-hidden="true"></span></li>
        <li class="svc run" data-svc="maj"><span class="svc-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span><span class="svc-txt"><b>Mises à jour</b><span class="svc-st">Recherche…</span></span><span class="svc-state" aria-hidden="true"></span></li>
      </ul>
      <div class="sp-bar"><i id="splash-bar"></i></div>
    </div>
  </div>
</div>

<a class="skip" href="#main" id="skip">Aller au contenu</a>
<div class="app">
  <aside class="rail glass" aria-label="Navigation">
    <span class="nav-ind" id="nav-ind" aria-hidden="true"></span>
    <div class="brand">
      <svg viewBox="0 0 64 64" width="38" height="38" aria-hidden="true"><use href="#logo-app"/></svg>
      <span class="brand-text"><span class="brand-name">Mon Carnet</span><span class="brand-sub" id="brand-sub"></span></span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <nav class="nav" id="nav-foot" aria-label="Réglages"></nav>
      <div class="sync" id="sync"><span class="dot"></span><span>Chargement…</span></div>
    </div>
  </aside>
  <div class="work">
    <header class="top glass">
      <button class="cmdk" type="button" data-act="palette" aria-keyshortcuts="Control+K"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Rechercher un cours, un mail, un événement…</span><kbd>Ctrl K</kbd></button>
      <span class="spacer"></span>
      <button class="btn titan-btn" type="button" id="titan-btn" data-act="titan-open" aria-keyshortcuts="Control+J" aria-pressed="false" title="Titan AI (Ctrl J)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Titan AI</span></button>
      <button class="btn ghost icon notif-btn" type="button" id="notif-btn" data-act="notif-toggle" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false"></button>
      <button class="btn ghost icon" type="button" id="theme-btn" data-act="theme-toggle" aria-label="Changer de thème"></button>
      <button class="btn primary" type="button" data-act="new-event" aria-keyshortcuts="Control+N" title="Ajouter un événement (Ctrl N)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="hide-sm">Ajouter</span></button>
    </header>
    <main id="main" tabindex="-1"><p class="loading">Chargement de ton carnet…</p></main>
  </div>
</div>
<div id="notif-root"></div>
<div id="titan-root"></div>
<div id="modal-root"></div>
<div id="palette-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>
<script src="core.js"></script>
<script src="views.js"></script>
<script src="conduite.js"></script>
<script src="notifs.js"></script>
<script src="mails.js"></script>
<script src="events.js"></script>
<script src="titan.js"></script>
<script src="voice.js"></script>
<script src="titanplus.js"></script>
<script src="onboarding.js"></script>
<script src="actions.js"></script>
</body>
</html>
